name: Bug report
description: Something in the code, CLI, API or web page is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! If the problem is a URL that got the
        wrong verdict, please use the **Wrong verdict** template instead. For security
        issues, see SECURITY.md and report privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python -m phishguard.predict "..."`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste any traceback or error message.
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - Command-line tool (predict)
        - Training (train)
        - REST API
        - Web page
        - Feature extraction / URL parsing
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and output of `pip show scikit-learn | head -2`.
      placeholder: Windows 11, Python 3.12, scikit-learn 1.5.0
    validations:
      required: true
